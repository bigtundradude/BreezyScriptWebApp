<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BreezyScript</title>
  <meta name="description" content="BreezyScript — the thinking structure for YouTube scripts. Your AI does the typing." />
  <style>
    /* Same design tokens as the app so both surfaces read as one product. */
    @font-face {
      font-family: 'Inter';
      src: url('/app/fonts/InterVariable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --color-primary: #818cf8;
      --color-bg: #09090b;
      --color-surface: #18181b;
      --color-border: #3f3f46;
      --color-border-subtle: #27272a;
      --color-text-primary: #f4f4f5;
      --color-text-secondary: #c4c4c8;
      --color-text-muted: #9b9ba3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 32px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--color-primary);
    }
    p.tagline {
      margin: 0;
      max-width: 460px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--color-text-secondary);
    }
    a.enter {
      display: inline-flex;
      align-items: center;
      height: 44px;
      padding: 0 24px;
      border-radius: 10px;
      background: var(--color-primary);
      color: #09090b;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    a.enter:hover { filter: brightness(1.08); }
    footer {
      position: fixed;
      bottom: 20px;
      font-size: 12px;
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>
  <h1>BreezyScript</h1>
  <p class="tagline">
    The thinking structure for YouTube scripts — ideas, packaging, brain dumps, and drafts.
    Your AI does the typing.
  </p>
  <a class="enter" href="/app/">Open the app</a>
  <footer>A private tool. The app requires owner sign-in.</footer>
</body>
</html>
